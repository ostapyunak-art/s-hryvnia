databases:
  - name: it-college-hub-db
    databaseName: it_college_hub_db
    user: it_college_hub_db_user
    plan: free
    region: frankfurt

services:
  - type: web
    name: it-college-hub
    runtime: node
    plan: free
    region: frankfurt
    rootDir: it-college-hub
    buildCommand: npm install && npm run build
    startCommand: npm start
    healthCheckPath: /api/health
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: it-college-hub-db
          property: connectionString
      - key: NODE_ENV
        value: production